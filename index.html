<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>应用中心 · 应用发布页</title>
<meta name="description" content="全部自研应用集合页，支持搜索、分类筛选与一键下载。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%237c5cff'/></svg>" />
<style>
:root{
  --bg:#0b0d12; --bg-soft:#11141c; --card:#151922; --card-hover:#1a1f2b;
  --line:#232a38; --text:#e7ebf3; --text-dim:#9aa4b6; --text-mute:#66708a;
  --brand:#7c5cff; --brand-2:#3ac0ff; --ok:#34d399; --shadow:0 18px 50px -18px rgba(0,0,0,.85);
  --radius:18px;
}
html[data-theme="light"]{
  --bg:#f4f6fb; --bg-soft:#ffffff; --card:#ffffff; --card-hover:#ffffff;
  --line:#e3e8f2; --text:#111726; --text-dim:#5b657a; --text-mute:#8b95a9;
  --brand:#5b3df5; --brand-2:#0f8dff; --shadow:0 14px 40px -20px rgba(24,38,80,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100vh; transition:background .3s,color .3s;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60vw 60vw at 12% -10%, rgba(124,92,255,.20), transparent 62%),
    radial-gradient(50vw 50vw at 92% 4%, rgba(58,192,255,.16), transparent 60%);
}
html[data-theme="light"] body::before{
  background:
    radial-gradient(60vw 60vw at 10% -12%, rgba(91,61,245,.12), transparent 62%),
    radial-gradient(50vw 50vw at 92% 2%, rgba(15,141,255,.12), transparent 60%);
}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}

.nav{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.nav-inner{display:flex;align-items:center;gap:18px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:.2px;text-decoration:none;color:var(--text);white-space:nowrap}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand-2));box-shadow:0 6px 18px -6px rgba(124,92,255,.8)}
.logo svg{width:16px;height:16px;display:block}
.search{flex:1;max-width:420px;position:relative}
.search input{
  width:100%;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--bg-soft);
  color:var(--text);padding:0 66px 0 38px;font-size:14px;outline:none;transition:.2s;
}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(124,92,255,.15)}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;opacity:.5}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-mute);border:1px solid var(--line);border-radius:6px;padding:2px 6px;pointer-events:none}
.nav-actions{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg-soft);
  color:var(--text-dim);display:grid;place-items:center;cursor:pointer;transition:.2s;text-decoration:none;
}
.icon-btn:hover{color:var(--text);border-color:var(--brand);transform:translateY(-1px)}
.icon-btn svg{width:17px;height:17px}

.hero{padding:54px 0 26px}
.eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-dim);
  border:1px solid var(--line);background:var(--bg-soft);padding:6px 12px;border-radius:99px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
h1{font-size:clamp(28px,4vw,42px);line-height:1.15;margin:18px 0 12px;letter-spacing:-.6px;font-weight:800}
h1 .accent{background:linear-gradient(100deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--text-dim);font-size:15px;line-height:1.75;max-width:620px;margin:0}
.stats{display:flex;gap:34px;margin-top:28px;flex-wrap:wrap}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.3px}
.stat span{font-size:12.5px;color:var(--text-mute)}

.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:32px 0 22px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:var(--bg-soft);color:var(--text-dim);
  height:34px;padding:0 15px;border-radius:99px;font-size:13.5px;cursor:pointer;transition:.18s;font-family:inherit;
}
.chip:hover{color:var(--text);border-color:var(--brand)}
.chip.on{background:linear-gradient(135deg,var(--brand),var(--brand-2));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 8px 22px -12px rgba(124,92,255,.9)}
.sort{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-mute)}
.sort select{
  height:34px;border-radius:9px;border:1px solid var(--line);background:var(--bg-soft);color:var(--text);
  padding:0 10px;font-size:13px;outline:none;font-family:inherit;cursor:pointer;
}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-bottom:70px}
.card{
  position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;display:flex;flex-direction:column;gap:14px;transition:.22s;overflow:hidden;
}
.card::after{
  content:"";position:absolute;inset:0 0 auto 0;height:1px;opacity:0;transition:.22s;
  background:linear-gradient(90deg,transparent,var(--brand),var(--brand-2),transparent);
}
.card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--brand) 45%,var(--line));box-shadow:var(--shadow);background:var(--card-hover)}
.card:hover::after{opacity:1}
.card-top{display:flex;gap:14px;align-items:center}
.app-icon{
  width:54px;height:54px;flex:0 0 54px;border-radius:15px;display:grid;place-items:center;font-size:26px;
  background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 10px 24px -12px var(--c1);
  position:relative;overflow:hidden;
}
.app-icon::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 55%)}
.app-icon span{position:relative;z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.card h3{margin:0 0 4px;font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.card .sub2{margin:0;font-size:12.5px;color:var(--text-mute)}
.desc{margin:0;font-size:13.5px;line-height:1.65;color:var(--text-dim);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:44px}
.platforms{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11.5px;padding:3px 9px;border-radius:7px;border:1px solid var(--line);color:var(--text-dim);background:var(--bg-soft)}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;border-top:1px dashed var(--line)}
.ver{font-size:12px;color:var(--text-mute);white-space:nowrap}
.ver b{color:var(--text-dim);font-weight:600}
.btn{
  display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:9px;font-size:13px;
  font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--text);background:var(--bg-soft);transition:.18s;
}
.btn:hover{border-color:transparent;color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand-2))}
.btn svg{width:14px;height:14px}
.btn-off{opacity:.5;cursor:not-allowed;border-style:dashed}
.btn-off:hover{color:var(--text-dim);background:var(--bg-soft);border-color:var(--line)}
.hot{position:absolute;top:14px;right:14px;font-size:10.5px;letter-spacing:.4px;color:#ffb86b;
  border:1px solid rgba(255,184,107,.35);background:rgba(255,184,107,.1);padding:2px 7px;border-radius:6px}
.empty{padding:70px 0;text-align:center;color:var(--text-mute);font-size:14px;grid-column:1/-1}

footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--text-mute);font-size:12.5px}
.foot-inner{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
.foot-inner a{color:var(--text-dim);text-decoration:none}
.foot-inner a:hover{color:var(--brand)}

@media (max-width:720px){
  .nav-inner{height:60px;gap:10px}
  .brand span{display:none}
  .search{max-width:none}
  .search kbd{display:none}
  .hero{padding:34px 0 18px}
  .stats{gap:22px}
  .grid{grid-template-columns:1fr;gap:14px}
}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="/">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/>
          <rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/>
        </svg>
      </div>
      <span id="brandName">应用中心</span>
    </a>
    <div class="search">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="q" type="search" placeholder="搜索应用名称、描述或标签…" autocomplete="off" />
      <kbd>Enter</kbd>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeBtn" title="切换主题" aria-label="切换主题">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.5"/>
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
        </svg>
      </button>
      <a class="icon-btn" href="/admin.html" title="管理后台" aria-label="管理后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 118 0v3"/>
        </svg>
      </a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div class="eyebrow"><span class="dot"></span> <span id="eyebrowText">站点运行中 · 应用数据由后台统一维护</span></div>
    <h1><span id="heroTitle">全部应用</span>，<span class="accent" id="heroAccent">一处下载</span></h1>
    <p class="sub" id="subText">把散落各处的自研应用集中到这一页：统一版本、统一入口、统一更新。按分类筛选，或直接搜索你需要的工具。</p>
    <div class="stats">
      <div class="stat"><b id="sCount">–</b><span>应用总数</span></div>
      <div class="stat"><b id="sPlat">–</b><span>覆盖平台</span></div>
      <div class="stat"><b id="sCate">–</b><span>分类</span></div>
      <div class="stat"><b id="sDate">–</b><span>最近更新</span></div>
    </div>
  </section>

  <section class="toolbar">
    <div class="chips" id="chips"></div>
    <div class="sort">
      <label for="sort">排序</label>
      <select id="sort">
        <option value="default">默认顺序</option>
        <option value="name">按名称</option>
        <option value="version">按版本</option>
      </select>
    </div>
  </section>

  <section class="grid" id="grid" aria-busy="true"></section>
</main>

<footer>
  <div class="wrap foot-inner">
    <span id="footText">© 2026 应用中心 · 静态发布 · 数据无数据库存储</span>
    <span>部署于 EdgeOne Pages · <a href="/admin.html">管理后台</a></span>
  </div>
</footer>

<script>
/* ===== 数据加载：优先环境变量 APPS_JSON（/api/apps），否则读静态 JSON ===== */
const FALLBACK_APPS = { updated: "2026-11-27", apps: [] };
const DEFAULT_SITE = {
  brand: "应用中心",
  title: "应用中心 · 应用发布页",
  heroTitle: "全部应用",
  heroAccent: "一处下载",
  subtitle: "把散落各处的自研应用集中到这一页：统一版本、统一入口、统一更新。按分类筛选，或直接搜索你需要的工具。",
  eyebrow: "站点运行中 · 应用数据由后台统一维护",
  footer: ""
};
let STATE = { all: [], cat: "全部", q: "", sort: "default" };

function applySite(site){
  const s = Object.assign({}, DEFAULT_SITE, site || {});
  const set = (id, val) => { const el = document.getElementById(id); if(el && val) el.textContent = val; };
  set("brandName", s.brand);
  set("heroTitle", s.heroTitle);
  set("heroAccent", s.heroAccent);
  set("subText", s.subtitle);
  set("eyebrowText", s.eyebrow);
  document.title = s.title || (s.brand + " · 应用发布页");
  document.getElementById("footText").textContent =
    (s.footer && s.footer.trim()) ? s.footer : `© ${new Date().getFullYear()} ${s.brand} · 静态发布 · 数据无数据库存储`;
}

async function loadData(){
  let data = null;
  // 1) 云端存储（后台保存即生效）
  try{
    const r0 = await fetch("/api/data", { headers: { "accept": "application/json" }, cache: "no-store" });
    if (r0.ok) data = await r0.json();
  }catch(e){}
  // 2) 环境变量 APPS_JSON
  if(!data || !Array.isArray(data.apps)){
    try{
      const r = await fetch("/api/apps", { headers: { "accept": "application/json" }, cache: "no-store" });
      if (r.ok) data = await r.json();
    }catch(e){}
  }
  // 3) 静态文件兜底
  if(!data || !Array.isArray(data.apps)){
    try{
      const r2 = await fetch("/data/apps.json?v=" + Date.now(), { headers: { "accept": "application/json" }, cache: "no-store" });
      if (r2.ok) data = await r2.json();
    }catch(e){}
  }
  const d = data || FALLBACK_APPS;
  STATE.all = d.apps || [];
  applySite(d.site);
  document.getElementById("sDate").textContent = d.updated || "—";
  render();
}

/* ===== 渲染 ===== */
function render(){
  const grid = document.getElementById("grid");
  const cats = ["全部", ...new Set(STATE.all.map(a => a.category).filter(Boolean))];
  const chips = document.getElementById("chips");
  chips.innerHTML = cats.map(c =>
    `<button class="chip ${c === STATE.cat ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`
  ).join("");
  chips.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    STATE.cat = b.dataset.cat; render();
  });

  const total = STATE.all.length;
  const plats = new Set(STATE.all.flatMap(a => a.platforms || []));
  document.getElementById("sCount").textContent = total;
  document.getElementById("sPlat").textContent = plats.size;
  document.getElementById("sCate").textContent = cats.length - 1;

  let list = STATE.all.filter(a => {
    const okCat = STATE.cat === "全部" || a.category === STATE.cat;
    const key = [a.name, a.desc, a.tag, (a.platforms||[]).join("")].join(" ").toLowerCase();
    const okQ = !STATE.q || key.includes(STATE.q.toLowerCase());
    return okCat && okQ;
  });
  if(STATE.sort === "name") list = [...list].sort((a,b)=> a.name.localeCompare(b.name, "zh"));
  if(STATE.sort === "version") list = [...list].sort((a,b)=> String(b.version||"").localeCompare(String(a.version||"")));

  if(!list.length){
    grid.innerHTML = `<div class="empty">没有匹配的应用，换个关键词或分类试试</div>`;
    grid.setAttribute("aria-busy","false");
    return;
  }

  grid.innerHTML = list.map(cardHtml).join("");
  grid.setAttribute("aria-busy","false");
}

function normUrl(u){
  let s = String(u == null ? "" : u).trim();
  s = s.replace(/^#+/, "").trim();            // 容错：误填的 #
  if(!s) return "";
  if(/^\/\//.test(s)) return "https:" + s;
  if(/^(https?:|mailto:|tel:|intent:)/i.test(s)) return s;
  if(/^[\w.-]+\.[A-Za-z]{2,}([/?#].*)?$/.test(s)) return "https://" + s;
  return s;
}

function cardHtml(a){
  const href = normUrl(a.url);
  const btn = href
    ? `<a class="btn" href="${esc(href)}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 3v12M7 11l5 5 5-5M4 20h16"/>
        </svg> 下载</a>`
    : `<span class="btn btn-off" title="还没填下载链接">待上传</span>`;
  return `
    <article class="card">
      ${a.hot ? '<span class="hot">推荐</span>' : ''}
      <div class="card-top">
        <div class="app-icon" style="--c1:${a.c1||'#7c5cff'};--c2:${a.c2||'#3ac0ff'}"><span>${a.icon||'📦'}</span></div>
        <div>
          <h3>${esc(a.name)}</h3>
          <p class="sub2">${esc(a.tag || a.category || '')}</p>
        </div>
      </div>
      <p class="desc">${esc(a.desc||'')}</p>
      <div class="platforms">${(a.platforms||[]).map(p=>`<span class="tag">${esc(p)}</span>`).join("")}</div>
      <div class="card-foot">
        <span class="ver">v<b>${esc(a.version||'1.0')}</b> · ${esc(a.size||'—')}</span>
        ${btn}
      </div>
    </article>`;
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ===== 交互 ===== */
document.getElementById("q").addEventListener("input", e => { STATE.q = e.target.value.trim(); render(); });
document.getElementById("sort").addEventListener("change", e => { STATE.sort = e.target.value; render(); });
document.getElementById("q").addEventListener("keydown", e => { if(e.key === "Enter") e.preventDefault(); });

/* 主题 */
const root = document.documentElement;
const saved = localStorage.getItem("apphub-theme");
if(saved) root.dataset.theme = saved;
document.getElementById("themeBtn").onclick = () => {
  const next = root.dataset.theme === "dark" ? "light" : "dark";
  root.dataset.theme = next;
  localStorage.setItem("apphub-theme", next);
};
document.getElementById("year") && (document.getElementById("year").textContent = new Date().getFullYear());

loadData();
</script>
</body>
</html>
